<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#030508" />
  <title>Krishna</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <div id="app">
    <!-- Preloader -->
    <div id="preloader" class="preloader" aria-label="Loading experience">
      <div class="preloader-aura"></div>
      <div class="preloader-card">
        <div class="preloader-crest">
          <svg class="crest-svg" width="64" height="64" viewBox="0 0 64 64" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M32 6C20 18 16 32 24 44C28 50 32 58 32 58C32 58 36 50 40 44C48 32 44 18 32 6Z"
              stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M32 16C26 24 24 32 29 40" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
            <path d="M32 16C38 24 40 32 35 40" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
            <ellipse cx="32" cy="24" rx="5" ry="7" fill="url(#blueGoldGrad)" />
            <circle cx="32" cy="24" r="2.5" fill="#1e3a8a" />
            <defs>
              <linearGradient id="goldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#e5b869" />
                <stop offset="100%" stop-color="#9a86ff" />
              </linearGradient>
              <linearGradient id="blueGoldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#e5b869" />
                <stop offset="100%" stop-color="#3b82f6" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="preloader-title">RADHE RADHE</div>
        <div class="preloader-shimmer-bar">
          <div class="shimmer-fill"></div>
        </div>
        <div class="preloader-subtitle">Please wait!!</div>
      </div>
    </div>

    <canvas id="scene-canvas"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Player dock: glass music bar + fullscreen button -->
    <div class="player-dock" id="player-dock">

      <!-- Minimized-state restore chip -->
      <div class="mini-restore" id="mini-restore">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
        <span id="mini-restore-title">Krishna Ji Flute Theme</span>
      </div>

      <div id="music-player-bar" class="player-bar is-playing">

        <!-- Left: artwork + track meta -->
        <div class="p-meta">
          <div class="p-art">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 6C20 18 16 32 24 44C28 50 32 58 32 58C32 58 36 50 40 44C48 32 44 18 32 6Z"
                stroke="url(#mArtGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <ellipse cx="32" cy="24" rx="5" ry="7" fill="url(#mBlueGoldGrad)" />
              <circle cx="32" cy="24" r="2.5" fill="#1e3a8a" />
              <defs>
                <linearGradient id="mArtGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="50%" stop-color="#e5b869" />
                  <stop offset="100%" stop-color="#9a86ff" />
                </linearGradient>
                <linearGradient id="mBlueGoldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#e5b869" />
                  <stop offset="100%" stop-color="#3b82f6" />
                </linearGradient>
              </defs>
            </svg>
            <div class="p-eq" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
          <div class="p-text">
            <div class="p-title" id="music-title">Krishna Ji Flute Theme</div>
            <div class="p-sub" id="music-artist">Mahabharat 2013 · Divine Melody</div>
          </div>
        </div>

        <!-- Center: transport + waveform scrubber -->
        <div class="p-center">
          <div class="p-buttons">
            <button id="btn-prev-creation" class="p-btn" title="Previous Creation" aria-label="Previous creation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <line x1="5" y1="19" x2="5" y2="5"></line>
              </svg>
            </button>

            <button id="btn-play-pause" class="p-btn p-play" title="Play / Pause" aria-label="Play or pause music">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
              </svg>
            </button>

            <button id="btn-next-creation" class="p-btn" title="Next Creation" aria-label="Next creation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19"></line>
              </svg>
            </button>
          </div>

          <div class="p-scrub">
            <span id="music-time-curr" class="p-time">0:00</span>
            <div class="p-track">
              <div class="p-wave" id="music-wave" aria-hidden="true"></div>
              <input id="music-progress" class="p-range" type="range" min="0" max="100" value="0" step="0.1"
                aria-label="Seek audio position" />
            </div>
            <span id="music-time-dur" class="p-time">4:54</span>
          </div>
        </div>

        <!-- Right: volume popover, minimize -->
        <div class="p-right">
          <div class="p-vol-wrap" id="music-vol-wrap">
            <button id="btn-volume-mute" class="p-btn" title="Volume" aria-label="Mute or unmute">
              <svg id="music-vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path id="music-vol-wave" d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                <g id="music-vol-muted-lines" style="display:none">
                  <line x1="22" y1="9" x2="16" y2="15"></line>
                  <line x1="16" y1="9" x2="22" y2="15"></line>
                </g>
              </svg>
            </button>
            <div class="p-vol-pop">
              <div class="p-vol-fill-track">
                <div class="p-vol-fill" id="music-vol-fill"></div>
                <input id="music-volume" class="p-vol-range" type="range" min="0" max="1" step="0.01" value="0.50"
                  aria-label="Adjust volume" />
              </div>
              <span class="p-vol-num" id="music-vol-num">50%</span>
            </div>
          </div>

          <button id="btn-toggle-mini" class="p-btn p-mini" title="Minimize Player" aria-label="Minimize player">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <!-- Standalone fullscreen button -->
      <button id="btn-fullscreen" class="fs-btn" aria-label="Toggle fullscreen" title="Fullscreen (Esc to exit)">
        <svg class="fs-icon fs-icon--enter" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9V4.5A1.5 1.5 0 0 1 4.5 3H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M15 3h4.5A1.5 1.5 0 0 1 21 4.5V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M21 15v4.5A1.5 1.5 0 0 1 19.5 21H15" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 21H4.5A1.5 1.5 0 0 1 3 19.5V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        <svg class="fs-icon fs-icon--exit" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3v5.5A.5.5 0 0 1 8.5 9H3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M21 9h-5.5A.5.5 0 0 1 15 8.5V3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M15 21v-5.5a.5.5 0 0 1 .5-.5H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M3 15h5.5a.5.5 0 0 1 .5.5V21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>

  <audio id="bg-audio" src="/assets/Krishna ji_flute.mp3" loop autoplay playsinline preload="auto"></audio>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
